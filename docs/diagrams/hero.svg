<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="MediFlow banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#071a33"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7c7b"/>
      <stop offset="1" stop-color="#2aa8a7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>

  <!-- flow: submit -> adjudicate -> pay -->
  <g stroke="#2aa8a7" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M40 240 C 160 240 200 170 320 170"/>
    <path d="M360 140 C 480 140 520 80 640 80"/>
    <path d="M680 110 C 800 110 840 180 960 180"/>
    <path d="M1000 210 C 1080 210 1100 150 1160 150"/>
    <circle cx="40" cy="240" r="5" fill="#0e7c7b" stroke="none"/>
    <circle cx="320" cy="170" r="5" fill="#0e7c7b" stroke="none"/>
    <circle cx="640" cy="80" r="5" fill="#0e7c7b" stroke="none"/>
    <circle cx="960" cy="180" r="5" fill="#0e7c7b" stroke="none"/>
    <circle cx="1160" cy="150" r="5" fill="#2aa8a7" stroke="none"/>
  </g>

  <!-- stylized insurance card (original artwork) -->
  <g transform="translate(760 70) rotate(-4)">
    <rect width="330" height="190" rx="14" fill="url(#card)"/>
    <rect x="0" y="0" width="330" height="46" rx="14" fill="#0b2545"/>
    <rect x="0" y="32" width="330" height="14" fill="#0b2545"/>
    <text x="18" y="30" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#7dd3d2">MEDIFLOW ADVANTAGE</text>
    <rect x="18" y="62" width="130" height="8" rx="4" fill="#94a3b8"/>
    <rect x="18" y="80" width="200" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="18" y="104" width="294" height="1.5" fill="#cbd5e1"/>
    <text x="18" y="134" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="2.5" fill="#1c2b3a">1EG4-TE5-MK73</text>
    <rect x="18" y="152" width="120" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="18" y="166" width="80" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="256" y="56" width="52" height="52" rx="8" fill="none" stroke="#0e7c7b" stroke-width="3"/>
    <rect x="268" y="72" width="28" height="6" fill="#0e7c7b"/>
    <rect x="268" y="84" width="28" height="6" fill="#0e7c7b"/>
    <rect x="279" y="60" width="6" height="44" fill="#0e7c7b"/>
  </g>

  <!-- title -->
  <g font-family="-apple-system, Segoe UI, Roboto, sans-serif">
    <text x="64" y="110" font-size="54" font-weight="700" fill="#ffffff">MediFlow</text>
    <text x="64" y="148" font-size="19" fill="#8fa3bd">Medicare enrollment &amp; claims adjudication</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13.5" fill="#7dd3d2">
      <text x="64" y="196">.NET 10 · Blazor · SQL Server · workers · MCP</text>
    </g>
    <g font-size="13" fill="#8fa3bd">
      <text x="64" y="238">AEP/SEP eligibility rules · CO/PR remittance codes · outbox-driven adjudication</text>
    </g>
    <rect x="64" y="256" width="360" height="4" rx="2" fill="url(#teal)"/>
  </g>
</svg>
