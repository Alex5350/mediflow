<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Original artwork of a stylized health-plan member card and an explanation-of-benefits document">
  <!--
    Original artwork created for this repository. It depicts generic,
    fictional plan documents ("Cascade Mutual Health" is invented) - it is not
    a reproduction of any real card, mark, or form.
  -->
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7c7b"/>
      <stop offset="1" stop-color="#2aa8a7"/>
    </linearGradient>
  </defs>

  <rect width="900" height="640" fill="#f2f5f9"/>

  <!-- member card -->
  <g transform="translate(80 70) rotate(-3)">
    <rect width="420" height="250" rx="18" fill="url(#pg)" stroke="#dce3ec"/>
    <rect width="420" height="64" rx="18" fill="#0b2545"/>
    <rect y="46" width="420" height="18" fill="#0b2545"/>
    <text x="24" y="40" font-family="-apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#7dd3d2">CASCADE MUTUAL HEALTH</text>
    <text x="24" y="60" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8fa3bd">ADVANTAGE ESSENTIALS (HMO) · PLAN YEAR 2026</text>
    <text x="24" y="112" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748b">MEDICARE BENEFICIARY IDENTIFIER</text>
    <text x="24" y="144" font-family="ui-monospace, Menlo, monospace" font-size="26" letter-spacing="3" fill="#1c2b3a">1EG4-TE5-MK73</text>
    <text x="24" y="182" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" fill="#1c2b3a">EFFECTIVE 01/01/2026</text>
    <text x="24" y="204" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" fill="#1c2b3a">GROUP MFP-2601 · IN NETWORK</text>
    <rect x="24" y="222" width="372" height="4" rx="2" fill="url(#stripe)"/>
  </g>

  <!-- EOB document -->
  <g transform="translate(470 220) rotate(2)">
    <rect width="360" height="380" rx="10" fill="url(#pg)" stroke="#dce3ec"/>
    <text x="24" y="42" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#1c2b3a">EXPLANATION OF BENEFITS</text>
    <text x="24" y="60" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#64748b">CLAIM CLM-2026-000481 · SERVICE 2026-06-15</text>

    <g font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#1c2b3a">
      <text x="24" y="96">99214  OFFICE VISIT 25 MIN</text>
      <text x="300" y="96" text-anchor="end">174.00</text>
      <text x="24" y="120">PR-1  DEDUCTIBLE</text>
      <text x="300" y="120" text-anchor="end" fill="#b45309">-174.00</text>
      <text x="24" y="156">80053  METABOLIC PANEL</text>
      <text x="300" y="156" text-anchor="end">29.00</text>
      <text x="24" y="180">PR-2  COINSURANCE 20%</text>
      <text x="300" y="180" text-anchor="end" fill="#b45309">-5.80</text>
      <text x="24" y="216">S9994  CONCIERGE FEE</text>
      <text x="300" y="216" text-anchor="end">0.00</text>
      <text x="24" y="240" fill="#b91c1c">CO-96  NON-COVERED CHARGE</text>
      <text x="300" y="240" text-anchor="end" fill="#b91c1c">0.00</text>
    </g>

    <rect x="24" y="262" width="312" height="1.5" fill="#dce3ec"/>
    <g font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1c2b3a">
      <text x="24" y="292">PLAN PAID</text><text x="300" y="292" text-anchor="end">23.20</text>
      <text x="24" y="318" fill="#0a5e5d">YOU OWE</text><text x="300" y="318" text-anchor="end" fill="#0a5e5d">179.80</text>
    </g>
    <rect x="24" y="340" width="312" height="4" rx="2" fill="url(#stripe)"/>
    <text x="24" y="366" font-family="-apple-system, Segoe UI, sans-serif" font-size="9.5" fill="#94a3b8">FICTIONAL DOCUMENT · GENERATED BY THE MEDIFLOW ADJUDICATION ENGINE</text>
  </g>

  <text x="450" y="628" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Original artwork - fictional plan, identifiers and amounts. Not affiliated with or derived from any government program or insurer.</text>
</svg>
