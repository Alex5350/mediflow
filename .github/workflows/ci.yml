name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_VERSION: '10.0.x'
  # x64 CI runners use real SQL Server 2022 for the Testcontainers suite.
  MEDIFLOW_TEST_SQL_IMAGE: mcr.microsoft.com/mssql/server:2022-latest

jobs:
  build:
    name: build + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Build (warnings as errors)
        run: dotnet build --no-restore
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

  unit-tests:
    name: unit tests (domain + bUnit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Domain unit tests
        run: >
          dotnet test tests/MediFlow.Domain.UnitTests
          --collect:"XPlat Code Coverage" --results-directory ./coverage
          -p:Threshold=80 -p:ThresholdStat=line -p:ThresholdType=lines
      - name: Blazor component tests
        run: dotnet test tests/MediFlow.Blazor.UnitTests

  integration-tests:
    name: integration tests (Testcontainers SQL)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Integration tests
        run: dotnet test tests/MediFlow.IntegrationTests --logger "console;verbosity=normal"

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-bootstrapped E2E
        run: ./scripts/e2e.sh
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore

  docker-build:
    name: docker images build
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        project: [MediFlow.Api, MediFlow.Claims.Api, MediFlow.Worker, MediFlow.Blazor]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.project }} image
        run: |
            TAG="mediflow/$(echo "${{ matrix.project }}" | tr '[:upper:]' '[:lower:]'):${{ github.sha }}"
            docker build -f src/${{ matrix.project }}/Dockerfile --build-arg PROJECT=${{ matrix.project }} -t "$TAG" .
